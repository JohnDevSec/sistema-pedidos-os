<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <main class="login-wrap">
    <form class="glass login-card" th:action="@{/login}" method="post">
      <h1>Entrar no sistema</h1>
      <p class="msg erro" th:if="${param.error}">E-mail ou senha incorretos. Tente de novo.</p>
      <p class="msg info" th:if="${param.logout}">Você saiu do sistema.</p>
      <label for="username">E-mail</label>
      <input id="username" name="username" type="email" autocomplete="username" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
