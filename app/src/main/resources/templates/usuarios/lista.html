<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="~{fragments/topbar :: topbar}"></header>
  <main class="glass content">
    <h1>Usuários</h1>
    <p class="msg info" th:if="${sucesso}" th:text="${sucesso}"></p>
    <div class="toolbar">
      <a class="btn" th:href="@{/usuarios/novo}">Novo usuário</a>
    </div>
    <div class="tabela-scroll">
      <table>
        <thead>
          <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="u : ${pagina.content}">
            <td th:text="${u.nome}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.perfil}"></td>
            <td th:text="${u.ativo} ? 'Ativo' : 'Inativo'"></td>
            <td><a th:href="@{/usuarios/{id}/editar(id=${u.id})}">Editar</a></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="paginacao">
      <a th:if="${pagina.hasPrevious()}" th:href="@{/usuarios(pagina=${pagina.number - 1})}">Anterior</a>
      <span>Página <span th:text="${pagina.number + 1}">1</span> de <span th:text="${pagina.totalPages == 0 ? 1 : pagina.totalPages}">1</span></span>
      <a th:if="${pagina.hasNext()}" th:href="@{/usuarios(pagina=${pagina.number + 1})}">Próxima</a>
    </div>
  </main>
</body>
</html>
