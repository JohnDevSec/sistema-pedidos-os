<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo}">Usuário</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="~{fragments/topbar :: topbar}"></header>
  <main class="glass content form-card">
    <h1 th:text="${titulo}">Usuário</h1>
    <form th:action="@{${acao}}" th:object="${usuario}" method="post">
      <p class="msg erro" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>

      <label for="nome">Nome</label>
      <input type="text" th:field="*{nome}" maxlength="120">
      <small class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>

      <label for="email">E-mail (usado no login)</label>
      <input type="text" th:field="*{email}" maxlength="160">
      <small class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

      <label for="senha" th:text="${editando} ? 'Nova senha (deixe em branco para manter)' : 'Senha'">Senha</label>
      <input type="password" id="senha" name="senha" maxlength="72" autocomplete="new-password">
      <small class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>
      <p class="dica">Mínimo de 8 caracteres.</p>

      <label for="perfil">Perfil</label>
      <select th:field="*{perfil}">
        <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option>
      </select>
      <small class="erro-campo" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></small>

      <div class="check">
        <input type="checkbox" th:field="*{ativo}">
        <label for="ativo1">Usuário ativo</label>
      </div>

      <div class="actions">
        <a class="btn btn-sec" th:href="@{/usuarios}">Cancelar</a>
        <button type="submit">Salvar</button>
      </div>
    </form>
  </main>
</body>
</html>
